# =============================================================
# Fichier de configuration - Installation automatisée de Tomcat
# Formation DevOps LINQINY - Module 1
# Version adaptée pour UBUNTU
# =============================================================
# Ce fichier contient toutes les valeurs que le script va utiliser.
# Modifie-les ici si besoin, PAS besoin de toucher au script lui-même.
# Ce fichier doit rester dans le MÊME dossier que install_tomcat.sh
#
# PRÉREQUIS : Java (JDK) doit déjà être installé sur la machine,
# ce script ne l'installe plus automatiquement.
# =============================================================

# Version de Tomcat à installer (voir https://tomcat.apache.org/)
TOMCAT_MAJOR="10"
TOMCAT_VERSION="10.1.59"

# Dossier où Tomcat sera installé
INSTALL_DIR="/opt/tomcat"

# Compte système (non-root) qui fera tourner Tomcat
SERVICE_USER="test-tomcat"
SERVICE_GROUP="test-tomcat"

# Port HTTP sur lequel Tomcat écoutera
TOMCAT_PORT="8080"

# Identifiants pour l'interface web Manager de Tomcat
MANAGER_USER="admin"
MANAGER_PASSWORD="Hassen1998"

# (Optionnel) URL d'un fichier .war à déployer automatiquement.
# Laisse vide ("") si tu veux déployer le war toi-même plus tard.
WAR_FILE="/home/hass/Downloads/jenkins-tomcat/sample.war"
